name: Daily digest

on:
  schedule:
    # 23:17 UTC = 07:17 Asia/Taipei target. Off-the-hour minute on purpose:
    # GitHub Actions queues are heaviest at :00 / :15 / :30 / :45 UTC, so
    # scheduling at :17 reduces typical scheduler drift from ~60-90 min
    # to ~10-30 min. Workflow usually fires close to 08:00 Taipei.
    - cron: "17 23 * * *"
    # Backup pass, one hour later. GitHub's scheduler is best-effort: on
    # 2026-08-26 the 23:17 slot was dropped outright — not delayed, not
    # failed, simply never queued, with no notification — and the family got
    # no digest that morning. Two independent slots make a total miss far
    # less likely. The guard step below keeps this from double-sending when
    # both fire, and lets it retry when the first one ran but failed.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - push

permissions:
  contents: read
  # The guard step reads this workflow's own run history to see whether the
  # day's digest already went out.
  actions: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TIMEZONE: Asia/Taipei
      LOG_LEVEL: INFO
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
      # Optional — when unset, the news section falls back to plain headlines.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      - name: Materialize private files from secrets
        env:
          WATCHLIST_YAML_B64: ${{ secrets.WATCHLIST_YAML_B64 }}
          LEDGER_CSV_B64: ${{ secrets.LEDGER_CSV_B64 }}
          POSITIONS_CSV_B64: ${{ secrets.POSITIONS_CSV_B64 }}
          PRICES_CSV_B64: ${{ secrets.PRICES_CSV_B64 }}
          RECURRING_CSV_B64: ${{ secrets.RECURRING_CSV_B64 }}
          LLM_CONTEXT_TXT_B64: ${{ secrets.LLM_CONTEXT_TXT_B64 }}
        run: |
          set -euo pipefail
          mkdir -p private
          if [ -n "${WATCHLIST_YAML_B64:-}" ]; then
            printf '%s' "$WATCHLIST_YAML_B64" | base64 -d > private/watchlist.yaml
          else
            cp config/watchlist.example.yaml private/watchlist.yaml
          fi
          # Ledger is intentionally optional. If the secret is unset, leave
          # private/ledger.csv absent — the source treats that as a clean
          # zero-Cashflow rather than seeding a real push with example data.
          if [ -n "${LEDGER_CSV_B64:-}" ]; then
            printf '%s' "$LEDGER_CSV_B64" | base64 -d > private/ledger.csv
          fi
          if [ -n "${POSITIONS_CSV_B64:-}" ]; then
            printf '%s' "$POSITIONS_CSV_B64" | base64 -d > private/positions.csv
          else
            cp data/positions.example.csv private/positions.csv
          fi
          # Quotes are optional and deliberately have no example fallback:
          # seeding a real push with sample prices would put fabricated
          # marks in front of the family. Absent file = holdings unquoted.
          if [ -n "${PRICES_CSV_B64:-}" ]; then
            printf '%s' "$PRICES_CSV_B64" | base64 -d > private/prices.csv
          fi
          # Recurring cashflow schedule and LLM context are optional; when
          # the secrets are unset the files are simply absent and the digest
          # degrades gracefully (positions-only projection, default context).
          if [ -n "${RECURRING_CSV_B64:-}" ]; then
            printf '%s' "$RECURRING_CSV_B64" | base64 -d > private/recurring.csv
          fi
          if [ -n "${LLM_CONTEXT_TXT_B64:-}" ]; then
            printf '%s' "$LLM_CONTEXT_TXT_B64" | base64 -d > private/llm_context.txt
          fi

      # Two scheduled slots mean two chances to reach the group, but only one
      # digest a day should actually arrive. A *successful* earlier scheduled
      # run on the same Taipei date is the signal to stand down; a failed one
      # is not, so a bad first attempt still gets retried by the second slot.
      # Manual dispatches never skip — they are deliberate.
      - name: Skip if today's digest already went out
        id: guard
        if: github.event_name == 'schedule'
        # Failing open is the whole point: if this check cannot answer, the
        # output stays unset and the digest sends. A duplicate message is a
        # mild annoyance; a guard that silently suppresses the only delivery
        # of the day recreates the exact failure it exists to prevent.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Taipei as a fixed UTC+8 offset rather than TZ=Asia/Taipei: Taiwan
          # has no daylight saving, so the offset is exact all year, and this
          # form needs no tz database — which means it behaves the same when
          # tested outside a Linux runner instead of silently returning UTC.
          today=$(date -u -d "+8 hours" +%F)
          already=false
          while read -r id created; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            if [ "$(date -u -d "$created + 8 hours" +%F)" = "$today" ]; then
              echo "run $id already delivered the digest for $today (Taipei)"
              already=true
              break
            fi
          done < <(
            gh run list --workflow digest.yml --event schedule --status success \
              --limit 20 --json databaseId,createdAt \
              --jq '.[] | "\(.databaseId) \(.createdAt)"'
          )
          echo "already=$already" >> "$GITHUB_OUTPUT"

      - name: Run digest
        if: steps.guard.outputs.already != 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "push" ]; then
            python -m src.main --push
          else
            python -m src.main --dry-run
          fi
